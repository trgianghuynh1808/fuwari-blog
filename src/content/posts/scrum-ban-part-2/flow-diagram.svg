<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1000" width="1760" height="1000" font-family="Inter, -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Scrumban workflow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#94a3b8"/>
    </marker>
    <g id="person" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-10" r="6"/>
      <path d="M-11 12 C-11 2 11 2 11 12"/>
    </g>
    <g id="card">
      <rect width="160" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="12" y="11" width="90" height="4" rx="2" fill="#cbd5e1"/>
      <rect x="12" y="20" width="60" height="4" rx="2" fill="#e2e8f0"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1760" height="1000" fill="#ffffff"/>

  <!-- phase bands -->
  <rect x="340" y="20" width="540" height="960" rx="20" fill="#eff6ff"/>
  <rect x="880" y="20" width="840" height="960" rx="20" fill="#ecfdf5"/>
  <text x="610" y="72" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="3" fill="#1d4ed8">PLANNING PHASE</text>
  <text x="1300" y="72" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="3" fill="#047857">IMPLEMENTING PHASE</text>

  <!-- ===== BACKLOG ZONE ===== -->
  <use href="#person" x="64" y="132"/>
  <text x="92" y="130" font-size="19" font-weight="600" fill="#0f172a">PO / PM / Leads /</text>
  <text x="92" y="154" font-size="19" font-weight="600" fill="#0f172a">DEV Teams</text>

  <line x1="160" y1="172" x2="160" y2="238" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="176" y="190" width="72" height="30" rx="15" fill="#0f172a"/>
  <text x="212" y="211" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#ffffff">PUSH</text>

  <text x="160" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Backlog</text>
  <rect x="60" y="282" width="200" height="190" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <use href="#card" x="80" y="300"/>
  <use href="#card" x="80" y="346"/>
  <use href="#card" x="80" y="392"/>
  <use href="#card" x="80" y="438" opacity="0.45"/>

  <use href="#person" x="64" y="548"/>
  <text x="92" y="555" font-size="19" font-weight="600" fill="#0f172a">Lead / PM</text>
  <path d="M160 484 L160 520" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-light)" transform="rotate(180 160 502)"/>
  <rect x="176" y="488" width="104" height="30" rx="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="228" y="509" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">↻ Update</text>

  <!-- ===== PULL: Backlog -> TODO ===== -->
  <line x1="268" y1="377" x2="452" y2="377" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="328" y="334" width="72" height="30" rx="15" fill="#0f172a"/>
  <text x="364" y="355" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#ffffff">PULL</text>
  <use href="#person" x="330" y="414"/>
  <text x="352" y="421" font-size="17" font-weight="600" fill="#334155">DEV</text>

  <!-- ===== TODO ===== -->
  <rect x="526" y="190" width="68" height="26" rx="13" fill="#dbeafe"/>
  <text x="560" y="208" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Board</text>
  <text x="560" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">TODO</text>
  <rect x="460" y="282" width="200" height="190" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
  <use href="#card" x="480" y="300"/>
  <use href="#card" x="480" y="346"/>
  <use href="#card" x="480" y="392"/>

  <!-- ===== PULL: TODO -> DOING ===== -->
  <line x1="668" y1="377" x2="932" y2="377" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="764" y="334" width="72" height="30" rx="15" fill="#0f172a"/>
  <text x="800" y="355" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#ffffff">PULL</text>
  <use href="#person" x="770" y="414"/>
  <text x="792" y="421" font-size="17" font-weight="600" fill="#334155">DEV</text>

  <!-- ===== BOARD (Implementing) ===== -->
  <path d="M940 212 L940 202 L1700 202 L1700 212" fill="none" stroke="#6ee7b7" stroke-width="2"/>
  <rect x="1286" y="189" width="68" height="26" rx="13" fill="#d1fae5"/>
  <text x="1320" y="207" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">Board</text>

  <!-- DOING -->
  <text x="1040" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DOING</text>
  <rect x="940" y="282" width="200" height="190" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <text x="1040" y="388" text-anchor="middle" font-size="64" font-weight="700" fill="#047857">0 / 3</text>
  <text x="1040" y="424" text-anchor="middle" font-size="16" font-weight="600" fill="#64748b">WIP limit</text>

  <!-- DOING <-> QA -->
  <line x1="1148" y1="353" x2="1212" y2="353" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1212" y1="401" x2="1148" y2="401" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- QA -->
  <text x="1320" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">QA</text>
  <rect x="1220" y="282" width="200" height="190" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <use href="#card" x="1240" y="300"/>
  <use href="#card" x="1240" y="346"/>

  <!-- QA -> DELIVERY -->
  <line x1="1428" y1="377" x2="1492" y2="377" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- DELIVERY -->
  <text x="1600" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DELIVERY</text>
  <rect x="1500" y="282" width="200" height="190" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <use href="#card" x="1520" y="300"/>
  <use href="#card" x="1520" y="346"/>

  <!-- ===== WIP callout ===== -->
  <line x1="1040" y1="480" x2="1040" y2="548" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-light)"/>
  <rect x="960" y="556" width="160" height="56" rx="12" fill="#047857"/>
  <text x="1040" y="591" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Limit WIP</text>

  <path d="M1128 584 L1170 534 M1128 584 L1170 584 M1128 584 L1170 634" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="1180" y="512" width="340" height="44" rx="22" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="1350" y="541" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Prevent bottleneck</text>
  <rect x="1180" y="562" width="340" height="44" rx="22" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="1350" y="591" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">More pro-active</text>
  <rect x="1180" y="612" width="340" height="44" rx="22" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="1350" y="641" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Work-life balance</text>

  <!-- ===== Planning note ===== -->
  <rect x="372" y="520" width="480" height="196" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="396" y="556" font-size="18" font-weight="700" fill="#1d4ed8">NOTE</text>
  <text x="396" y="594" font-size="19" font-weight="600" fill="#0f172a">Rank</text>
  <text x="396" y="626" font-size="19" font-weight="600" fill="#0f172a">Priority</text>
  <text x="396" y="658" font-size="19" font-weight="600" fill="#0f172a">Type</text>
  <text x="396" y="690" font-size="19" font-weight="600" fill="#94a3b8">…</text>
  <path d="M488 590 C528 590 528 626 568 626 M488 622 C528 622 528 626 568 626 M488 654 C528 654 528 626 568 626 M488 686 C528 686 528 626 568 626" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="580" y="590" width="244" height="72" rx="14" fill="#dbeafe"/>
  <text x="702" y="620" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Has agreement</text>
  <text x="702" y="646" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">of teams</text>

  <!-- ===== Implementing note ===== -->
  <rect x="940" y="700" width="760" height="120" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <text x="964" y="734" font-size="18" font-weight="700" fill="#047857">NOTE</text>
  <circle cx="972" cy="765" r="4" fill="#10b981"/>
  <text x="990" y="771" font-size="19" font-weight="600" fill="#0f172a">Keep Daily meeting</text>
  <circle cx="972" cy="797" r="4" fill="#10b981"/>
  <text x="990" y="803" font-size="19" font-weight="600" fill="#0f172a">Retrospective after the end of each Sprint</text>

  <!-- ===== Timeline ===== -->
  <line x1="350" y1="868" x2="1700" y2="868" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="856" x2="350" y2="880" stroke="#334155" stroke-width="2.5"/>
  <line x1="880" y1="854" x2="880" y2="882" stroke="#334155" stroke-width="2.5"/>
  <text x="1690" y="850" text-anchor="end" font-size="17" font-style="italic" font-weight="600" fill="#334155">time</text>
  <text x="615" y="912" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">2–3 days <tspan font-weight="500" fill="#2563eb">(flexible)</tspan></text>
  <text x="1290" y="912" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">2 weeks <tspan font-weight="500" fill="#059669">(fixed)</tspan></text>

  <!-- key takeaway -->
  <rect x="380" y="934" width="470" height="36" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="615" y="958" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">★ Planning enough for fixed time</text>
</svg>
